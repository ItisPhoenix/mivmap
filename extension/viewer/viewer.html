<!doctype html>
<html lang="en" data-canvas-theme="chalk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mivmap</title>
    <link rel="icon" href="../icons/icon32.png" />
    <link rel="preload" href="../fonts/atkinson-hyperlegible-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="../fonts/atkinson-hyperlegible-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="../shared/fonts.css" />
    <link rel="stylesheet" href="viewer.css" />
    <link rel="stylesheet" href="video-preview.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="viewer.html" title="Mivmap home">
        <img src="../icons/icon48.png" alt="" width="28" height="28" />
        <span>Mivmap</span>
        <i id="backend-status" class="status-dot" title="Connecting…"></i>
      </a>

      <div class="title-block">
        <input id="map-title" aria-label="Mindmap title" placeholder="Untitled mindmap" />
        <div class="meta-line">
          <a id="video-link" target="_blank" rel="noopener" hidden></a>
          <span id="meta-chips"></span>
        </div>
      </div>

      <nav class="toolbar" aria-label="Viewer actions">
        <div class="search">
          <input id="search" type="search" placeholder="Search concepts" aria-label="Search nodes" />
          <div id="search-results" class="dropdown search-results" hidden></div>
        </div>
        <button id="btn-content-map" class="btn toolbar-quiet" aria-pressed="true" aria-controls="content-map" title="Show or hide the outline">Outline</button>
        <button id="btn-focus-mode" class="btn toolbar-quiet" aria-pressed="false" title="Focus one section / show full map">Focus section</button>
        <button id="btn-inspector" class="btn toolbar-quiet icon-only" aria-pressed="false" aria-controls="inspector" aria-label="Show concept inspector" title="Show concept inspector" hidden>◎</button>
        <button id="btn-study" class="btn btn-accent" title="Flashcards & quizzes">🎓 Study</button>
        <div class="menu">
          <button id="btn-more" class="btn icon-only" aria-haspopup="true" aria-label="More actions" title="More">⋯</button>
          <div id="more-menu" class="dropdown dropdown-right" hidden>
            <div id="more-pinned" class="more-pinned">
              <button id="btn-share" class="btn btn-small" title="Real-time collaboration">👥 Share</button>
              <button id="btn-export" class="btn btn-small" aria-haspopup="true">⤓ Export</button>
              <div id="export-menu" class="dropdown more-submenu" hidden></div>
              <button id="btn-voice" class="btn btn-small" title="Voice commands">🎙 Voice</button>
              <div id="layer-seg" class="seg" role="radiogroup" aria-label="What the map shows"></div>
            </div>
            <div id="more-dynamic"></div>
          </div>
        </div>
      </nav>
    </header>

    <main id="stage" class="stage">
      <div id="drawer-backdrop" class="drawer-backdrop" hidden aria-hidden="true"></div>
      <div id="canvas" tabindex="-1"></div>

      <aside id="content-map" class="content-map" aria-label="Content map"></aside>

      <div id="right-rail" class="right-rail">
        <aside id="inspector" class="panel" hidden aria-label="Node inspector"></aside>
        <section id="assistant" class="assistant-dock" hidden aria-label="Ask about this node"></section>
        <div id="inspector-empty" class="inspector-empty">
          <div class="inspector-empty-mark">◎</div>
          <h2>Nothing selected</h2>
          <p>Pick a concept on the map to see its explanation, evidence and notes.</p>
        </div>
      </div>
      <div id="polish-pill" class="polish-pill" hidden role="status">Polishing labels…</div>

      <div id="hud" class="hud"></div>
      <div id="presence-bar" class="presence-bar"></div>

      <div id="focus-label" class="focus-label" hidden aria-live="polite"></div>
      <div class="zoom-controls" role="group" aria-label="Map navigation">
        <button id="section-prev" class="btn icon-only" title="Previous section ([)" hidden>◀</button>
        <button id="section-next" class="btn icon-only" title="Next section (])" hidden>▶</button>
        <button id="zoom-in" class="btn icon-only" title="Zoom in (+)">＋</button>
        <button id="zoom-out" class="btn icon-only" title="Zoom out (−)">－</button>
        <button id="zoom-focus" class="btn icon-only" title="Focus selected node">◎</button>
        <button id="zoom-fit" class="btn icon-only" title="Fit to screen (f)">⤢</button>
      </div>

      <div id="voice-indicator" class="voice-indicator" hidden></div>

      <section id="empty-state" class="empty-state" hidden>
        <h1>Turn any video into a <span class="hl">mindmap</span></h1>
        <p>Open a YouTube video and press the <b>Mindmap</b> button (or Alt+M) — or paste a link:</p>
        <div class="empty-form">
          <input id="empty-url" type="url" placeholder="https://www.youtube.com/watch?v=…" aria-label="YouTube URL" />
          <button id="empty-generate" class="btn btn-accent">Generate</button>
        </div>
        <div class="panel-row center">
          <button id="empty-demo" class="btn dev-only">🧪 Demo map</button>
          <button id="empty-library" class="btn">📚 Library</button>
          <button id="empty-join" class="btn">👥 Join room</button>
        </div>
        <div id="empty-recent" class="recent"></div>
      </section>

      <section id="progress-overlay" class="progress-overlay" hidden aria-live="polite">
        <div class="progress-card">
          <h2 id="progress-title">Your video</h2>
          <ol id="progress-steps" class="progress-steps"></ol>
          <div id="progress-bar" class="sketch-bar"><span></span></div>
          <p id="progress-stage" class="progress-stage">Starting…</p>
          <p id="progress-detail" class="progress-detail dev-only"></p>
        </div>
      </section>
    </main>

    <div id="context-menu" class="dropdown context-menu" hidden></div>
    <div id="toasts"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
